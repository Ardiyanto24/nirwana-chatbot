name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]
# Verifikasi Milestone 8.7 Checkpoint 5: memicu run nyata di branch
# staging untuk membuktikan trigger 3-branch benar-benar bekerja.

jobs:
  ruff:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/

  golangci-lint:
    name: golangci-lint (govet + staticcheck + gosec)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom-exporter/supabaseexporter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: custom-exporter/supabaseexporter/go.mod
          cache-dependency-path: custom-exporter/supabaseexporter/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          working-directory: custom-exporter/supabaseexporter

  test-python-fast:
    name: test-python-fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run pytest tests/
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # DATABASE_URL disediakan (cepat+andal, beda dari OPENROUTER_API_KEY -
        # Keputusan 10, decisions.md: role_title TurnPayload database-backed
        # sejak M1.5, dibutuhkan luas di luar 8 grup LLM). OPENROUTER_API_KEY
        # SENGAJA tidak diberikan di sini - skipif existing (module-level
        # pytestmark atau per-fungsi @pytestmark_llm) otomatis skip bersih
        # test yang genuinely butuh panggilan LLM (mahal+flaky), presisi
        # per-fungsi di file campuran gated+non-gated (Keputusan 5).

  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      context_resolution: ${{ steps.filter.outputs.context_resolution }}
      decomposition: ${{ steps.filter.outputs.decomposition }}
      domain_gate: ${{ steps.filter.outputs.domain_gate }}
      query_engine: ${{ steps.filter.outputs.query_engine }}
      interpretation: ${{ steps.filter.outputs.interpretation }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            context_resolution:
              - 'src/layers/context_resolution/**'
              - 'src/schemas/turn_dependency.py'
              - 'src/schemas/rewrite.py'
              - 'src/schemas/session_memory.py'
              - 'src/schemas/matching.py'
              - 'src/prompts/context_resolution/**'
            decomposition:
              - 'src/layers/decomposition/**'
              - 'src/schemas/decomposition.py'
              - 'src/prompts/decomposition/**'
            domain_gate:
              - 'src/layers/domain_gate/**'
              - 'src/schemas/domain_gate.py'
              - 'src/schemas/authorization.py'
              - 'src/schemas/cakupan_individu.py'
              - 'src/config/role_permissions.py'
              - 'src/prompts/domain_gate/**'
            query_engine:
              - 'src/layers/query_engine/**'
              - 'src/schemas/query_engine.py'
              - 'src/config/slug_view_chatbot_api.py'
              - 'src/prompts/query_engine/**'
            interpretation:
              - 'src/layers/interpretation/**'
              - 'src/schemas/interpretation.py'
              - 'src/prompts/interpretation/**'
            shared:
              - 'src/config/llm.py'
              - 'src/prompts/loader.py'

  test-python-llm:
    name: test-python-llm
    needs: changes
    runs-on: ubuntu-latest
    # Hanya jalan kalau minimal satu grup di atas genuinely berubah -
    # union kosong berarti job ini SKIP bersih (ditangani job `test-gate`
    # aggregator, Keputusan 8, supaya tidak memblokir required status
    # check selamanya untuk PR yang tidak menyentuh layer manapun).
    if: |
      needs.changes.outputs.context_resolution == 'true' ||
      needs.changes.outputs.decomposition == 'true' ||
      needs.changes.outputs.domain_gate == 'true' ||
      needs.changes.outputs.query_engine == 'true' ||
      needs.changes.outputs.interpretation == 'true' ||
      needs.changes.outputs.shared == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Bangun daftar file test target dari grup yang berubah
        id: targets
        env:
          CTX: ${{ needs.changes.outputs.context_resolution }}
          DECOMP: ${{ needs.changes.outputs.decomposition }}
          DOMAIN: ${{ needs.changes.outputs.domain_gate }}
          QE: ${{ needs.changes.outputs.query_engine }}
          INTERP: ${{ needs.changes.outputs.interpretation }}
          SHARED: ${{ needs.changes.outputs.shared }}
        run: |
          FILES=""
          if [ "$CTX" = "true" ] || [ "$SHARED" = "true" ]; then
            FILES="$FILES tests/layers/context_resolution/test_turn_dependency.py tests/layers/context_resolution/test_rewrite.py tests/layers/context_resolution/test_matching.py"
          fi
          if [ "$DECOMP" = "true" ] || [ "$SHARED" = "true" ]; then
            FILES="$FILES tests/layers/decomposition/test_decompose.py"
          fi
          if [ "$DOMAIN" = "true" ] || [ "$SHARED" = "true" ]; then
            FILES="$FILES tests/layers/domain_gate/test_identifikasi.py tests/layers/domain_gate/test_domain_gate.py tests/layers/domain_gate/test_verifikasi_titik_buta.py tests/layers/domain_gate/test_deteksi_cakupan_individu.py tests/layers/domain_gate/test_cakupan_individu.py tests/layers/domain_gate/test_verifikasi_cakupan_individu.py"
          fi
          if [ "$QE" = "true" ] || [ "$SHARED" = "true" ]; then
            FILES="$FILES tests/layers/query_engine/test_query_engine.py"
          fi
          if [ "$INTERP" = "true" ] || [ "$SHARED" = "true" ]; then
            FILES="$FILES tests/layers/interpretation/test_interpretation.py"
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
      - run: uv run pytest ${{ steps.targets.outputs.files }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  rbac-regression:
    name: rbac-regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run pytest tests/rbac_regression/ -v
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Job TERPISAH dari test-python-fast/test-python-llm (Milestone
        # 8.3, Keputusan 3, forced KK sumber) - kegagalan di sini adalah
        # sinyal kebocoran RBAC prioritas tinggi, bukan kegagalan unit
        # test generik. Klasifikasi Domain Gate (LLM) di-fix ke hasil
        # historis (Keputusan 1) - genuinely TANPA OPENROUTER_API_KEY,
        # cuma DATABASE_URL untuk periksa_otorisasi_semua() nyata
        # (Keputusan 4).

  changes-prompts:
    name: changes-prompts
    runs-on: ubuntu-latest
    # Filter TERPISAH dari job `changes` (M8.2) - granularitas beda total:
    # per-prompt-file presisi (17 config, biaya LLM sungguhan per skenario),
    # bukan per-layer kasar (Milestone 8.4, Keputusan 1, decisions.md).
    outputs:
      context_resolution_turn_dependency: ${{ steps.filter.outputs.context_resolution_turn_dependency }}
      context_resolution_rewrite: ${{ steps.filter.outputs.context_resolution_rewrite }}
      context_resolution_matching: ${{ steps.filter.outputs.context_resolution_matching }}
      decomposition_klasifikasi: ${{ steps.filter.outputs.decomposition_klasifikasi }}
      decomposition_pemecahan: ${{ steps.filter.outputs.decomposition_pemecahan }}
      decomposition_verifikasi: ${{ steps.filter.outputs.decomposition_verifikasi }}
      domain_gate_identifikasi: ${{ steps.filter.outputs.domain_gate_identifikasi }}
      domain_gate_verifikasi_titik_buta: ${{ steps.filter.outputs.domain_gate_verifikasi_titik_buta }}
      domain_gate_deteksi_cakupan_individu: ${{ steps.filter.outputs.domain_gate_deteksi_cakupan_individu }}
      domain_gate_verifikasi_cakupan_individu: ${{ steps.filter.outputs.domain_gate_verifikasi_cakupan_individu }}
      retriever_kecocokan_makna_generate: ${{ steps.filter.outputs.retriever_kecocokan_makna_generate }}
      retriever_kecocokan_makna_verifikasi: ${{ steps.filter.outputs.retriever_kecocokan_makna_verifikasi }}
      retriever_kecukupan_struktural_fallback: ${{ steps.filter.outputs.retriever_kecukupan_struktural_fallback }}
      query_engine_penyusunan_request: ${{ steps.filter.outputs.query_engine_penyusunan_request }}
      query_engine_verifikasi_bentuk_request: ${{ steps.filter.outputs.query_engine_verifikasi_bentuk_request }}
      interpretation_narasi: ${{ steps.filter.outputs.interpretation_narasi }}
      interpretation_verifikasi_kesetiaan: ${{ steps.filter.outputs.interpretation_verifikasi_kesetiaan }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            context_resolution_turn_dependency:
              - 'src/prompts/context_resolution/turn_dependency.md'
              - 'prompt_reliability/context_resolution/turn_dependency.promptfooconfig.yaml'
            context_resolution_rewrite:
              - 'src/prompts/context_resolution/rewrite.md'
              - 'prompt_reliability/context_resolution/rewrite.promptfooconfig.yaml'
            context_resolution_matching:
              - 'src/prompts/context_resolution/matching.md'
              - 'prompt_reliability/context_resolution/matching.promptfooconfig.yaml'
            decomposition_klasifikasi:
              - 'src/prompts/decomposition/klasifikasi.md'
              - 'prompt_reliability/decomposition/klasifikasi.promptfooconfig.yaml'
            decomposition_pemecahan:
              - 'src/prompts/decomposition/pemecahan.md'
              - 'prompt_reliability/decomposition/pemecahan.promptfooconfig.yaml'
            decomposition_verifikasi:
              - 'src/prompts/decomposition/verifikasi.md'
              - 'prompt_reliability/decomposition/verifikasi.promptfooconfig.yaml'
            domain_gate_identifikasi:
              - 'src/prompts/domain_gate/identifikasi.md'
              - 'prompt_reliability/domain_gate/identifikasi.promptfooconfig.yaml'
              - 'src/layers/domain_gate/identifikasi.py'
            domain_gate_verifikasi_titik_buta:
              - 'src/prompts/domain_gate/verifikasi_titik_buta.md'
              - 'prompt_reliability/domain_gate/verifikasi_titik_buta.promptfooconfig.yaml'
              - 'src/layers/domain_gate/verifikasi_titik_buta.py'
            domain_gate_deteksi_cakupan_individu:
              - 'src/prompts/domain_gate/deteksi_cakupan_individu.md'
              - 'prompt_reliability/domain_gate/deteksi_cakupan_individu.promptfooconfig.yaml'
              - 'src/layers/domain_gate/deteksi_cakupan_individu.py'
            domain_gate_verifikasi_cakupan_individu:
              - 'src/prompts/domain_gate/verifikasi_cakupan_individu.md'
              - 'prompt_reliability/domain_gate/verifikasi_cakupan_individu.promptfooconfig.yaml'
              - 'src/layers/domain_gate/verifikasi_cakupan_individu.py'
            retriever_kecocokan_makna_generate:
              - 'src/prompts/retriever/kecocokan_makna_generate.md'
              - 'prompt_reliability/retriever/kecocokan_makna_generate.promptfooconfig.yaml'
              - 'src/layers/retriever/kecocokan_makna.py'
            retriever_kecocokan_makna_verifikasi:
              - 'src/prompts/retriever/kecocokan_makna_verifikasi.md'
              - 'prompt_reliability/retriever/kecocokan_makna_verifikasi.promptfooconfig.yaml'
              - 'src/layers/retriever/kecocokan_makna.py'
            retriever_kecukupan_struktural_fallback:
              - 'src/prompts/retriever/kecukupan_struktural_fallback.md'
              - 'prompt_reliability/retriever/kecukupan_struktural_fallback.promptfooconfig.yaml'
            query_engine_penyusunan_request:
              - 'src/prompts/query_engine/penyusunan_request.md'
              - 'prompt_reliability/query_engine/penyusunan_request.promptfooconfig.yaml'
            query_engine_verifikasi_bentuk_request:
              - 'src/prompts/query_engine/verifikasi_bentuk_request.md'
              - 'prompt_reliability/query_engine/verifikasi_bentuk_request.promptfooconfig.yaml'
            interpretation_narasi:
              - 'src/prompts/interpretation/narasi.md'
              - 'prompt_reliability/interpretation/narasi.promptfooconfig.yaml'
            interpretation_verifikasi_kesetiaan:
              - 'src/prompts/interpretation/verifikasi_kesetiaan.md'
              - 'prompt_reliability/interpretation/verifikasi_kesetiaan.promptfooconfig.yaml'
            shared:
              - 'prompt_reliability/provider.py'
              - 'prompt_reliability/push_results.py'
              - 'prompt_reliability/run_and_push.py'
              - 'prompt_reliability/package.json'
              - 'prompt_reliability/package-lock.json'
              - 'src/prompts/loader.py'
              - 'src/config/llm.py'

  prompt-eval:
    name: prompt-eval
    needs: changes-prompts
    runs-on: ubuntu-latest
    # timeout-minutes eksplisit - riwayat hang OpenRouter tanpa exception
    # (keterbatasan-diterima.md #7, recurrence M5.1/M7.16/M7.17), job ini
    # bisa menjalankan sampai 17 config berurutan kalau `shared` berubah.
    timeout-minutes: 45
    if: |
      needs.changes-prompts.outputs.context_resolution_turn_dependency == 'true' ||
      needs.changes-prompts.outputs.context_resolution_rewrite == 'true' ||
      needs.changes-prompts.outputs.context_resolution_matching == 'true' ||
      needs.changes-prompts.outputs.decomposition_klasifikasi == 'true' ||
      needs.changes-prompts.outputs.decomposition_pemecahan == 'true' ||
      needs.changes-prompts.outputs.decomposition_verifikasi == 'true' ||
      needs.changes-prompts.outputs.domain_gate_identifikasi == 'true' ||
      needs.changes-prompts.outputs.domain_gate_verifikasi_titik_buta == 'true' ||
      needs.changes-prompts.outputs.domain_gate_deteksi_cakupan_individu == 'true' ||
      needs.changes-prompts.outputs.domain_gate_verifikasi_cakupan_individu == 'true' ||
      needs.changes-prompts.outputs.retriever_kecocokan_makna_generate == 'true' ||
      needs.changes-prompts.outputs.retriever_kecocokan_makna_verifikasi == 'true' ||
      needs.changes-prompts.outputs.retriever_kecukupan_struktural_fallback == 'true' ||
      needs.changes-prompts.outputs.query_engine_penyusunan_request == 'true' ||
      needs.changes-prompts.outputs.query_engine_verifikasi_bentuk_request == 'true' ||
      needs.changes-prompts.outputs.interpretation_narasi == 'true' ||
      needs.changes-prompts.outputs.interpretation_verifikasi_kesetiaan == 'true' ||
      needs.changes-prompts.outputs.shared == 'true'
    env:
      PROMPTFOO_CACHE_PATH: ${{ github.workspace }}/.promptfoo-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm ci (prompt_reliability)
        working-directory: prompt_reliability
        run: npm ci
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - uses: actions/cache@v4
        with:
          path: ${{ env.PROMPTFOO_CACHE_PATH }}
          key: promptfoo-cache-${{ runner.os }}
          restore-keys: |
            promptfoo-cache-${{ runner.os }}-
      - name: Bangun daftar config yang relevan dari filter yang berubah
        id: targets
        env:
          CRT: ${{ needs.changes-prompts.outputs.context_resolution_turn_dependency }}
          CRR: ${{ needs.changes-prompts.outputs.context_resolution_rewrite }}
          CRM: ${{ needs.changes-prompts.outputs.context_resolution_matching }}
          DK: ${{ needs.changes-prompts.outputs.decomposition_klasifikasi }}
          DP: ${{ needs.changes-prompts.outputs.decomposition_pemecahan }}
          DV: ${{ needs.changes-prompts.outputs.decomposition_verifikasi }}
          DGI: ${{ needs.changes-prompts.outputs.domain_gate_identifikasi }}
          DGVT: ${{ needs.changes-prompts.outputs.domain_gate_verifikasi_titik_buta }}
          DGDC: ${{ needs.changes-prompts.outputs.domain_gate_deteksi_cakupan_individu }}
          DGVC: ${{ needs.changes-prompts.outputs.domain_gate_verifikasi_cakupan_individu }}
          RKG: ${{ needs.changes-prompts.outputs.retriever_kecocokan_makna_generate }}
          RKV: ${{ needs.changes-prompts.outputs.retriever_kecocokan_makna_verifikasi }}
          RKF: ${{ needs.changes-prompts.outputs.retriever_kecukupan_struktural_fallback }}
          QEP: ${{ needs.changes-prompts.outputs.query_engine_penyusunan_request }}
          QEV: ${{ needs.changes-prompts.outputs.query_engine_verifikasi_bentuk_request }}
          IN: ${{ needs.changes-prompts.outputs.interpretation_narasi }}
          IVK: ${{ needs.changes-prompts.outputs.interpretation_verifikasi_kesetiaan }}
          SHARED: ${{ needs.changes-prompts.outputs.shared }}
        run: |
          if [ "$SHARED" = "true" ]; then
            CONFIGS="prompt_reliability/context_resolution/turn_dependency.promptfooconfig.yaml prompt_reliability/context_resolution/rewrite.promptfooconfig.yaml prompt_reliability/context_resolution/matching.promptfooconfig.yaml prompt_reliability/decomposition/klasifikasi.promptfooconfig.yaml prompt_reliability/decomposition/pemecahan.promptfooconfig.yaml prompt_reliability/decomposition/verifikasi.promptfooconfig.yaml prompt_reliability/domain_gate/identifikasi.promptfooconfig.yaml prompt_reliability/domain_gate/verifikasi_titik_buta.promptfooconfig.yaml prompt_reliability/domain_gate/deteksi_cakupan_individu.promptfooconfig.yaml prompt_reliability/domain_gate/verifikasi_cakupan_individu.promptfooconfig.yaml prompt_reliability/retriever/kecocokan_makna_generate.promptfooconfig.yaml prompt_reliability/retriever/kecocokan_makna_verifikasi.promptfooconfig.yaml prompt_reliability/retriever/kecukupan_struktural_fallback.promptfooconfig.yaml prompt_reliability/query_engine/penyusunan_request.promptfooconfig.yaml prompt_reliability/query_engine/verifikasi_bentuk_request.promptfooconfig.yaml prompt_reliability/interpretation/narasi.promptfooconfig.yaml prompt_reliability/interpretation/verifikasi_kesetiaan.promptfooconfig.yaml"
          else
            CONFIGS=""
            if [ "$CRT" = "true" ]; then CONFIGS="$CONFIGS prompt_reliability/context_resolution/turn_dependency.promptfooconfig.yaml"; fi
            if [ "$CRR" = "true" ]; then CONFIGS="$CONFIGS prompt_reliability/context_resolution/rewrite.promptfooconfig.yaml"; fi
            if [ "$CRM" = "true" ]; then CONFIGS="$CONFIGS prompt_reliability/context_resolution/matching.promptfooconfig.yaml"; fi
            if [ "$DK" = "true" ]; then CONFIGS="$CONFIGS prompt_reliability/decomposition/klasifikasi.promptfooconfig.yaml"; fi
            if [ "$DP" = "true" ]; then CONFIGS="$CONFIGS prompt_reliability/decomposition/pemecahan.promptfooconfig.yaml"; fi
            if [ "$DV" = "true" ]; then CONFIGS="$CONFIGS prompt_reliability/decomposition/verifikasi.promptfooconfig.yaml"; fi
            if [ "$DGI" = "true" ]; then CONFIGS="$CONFIGS prompt_reliability/domain_gate/identifikasi.promptfooconfig.yaml"; fi
            if [ "$DGVT" = "true" ]; then CONFIGS="$CONFIGS prompt_reliability/domain_gate/verifikasi_titik_buta.promptfooconfig.yaml"; fi
            if [ "$DGDC" = "true" ]; then CONFIGS="$CONFIGS prompt_reliability/domain_gate/deteksi_cakupan_individu.promptfooconfig.yaml"; fi
            if [ "$DGVC" = "true" ]; then CONFIGS="$CONFIGS prompt_reliability/domain_gate/verifikasi_cakupan_individu.promptfooconfig.yaml"; fi
            if [ "$RKG" = "true" ]; then CONFIGS="$CONFIGS prompt_reliability/retriever/kecocokan_makna_generate.promptfooconfig.yaml"; fi
            if [ "$RKV" = "true" ]; then CONFIGS="$CONFIGS prompt_reliability/retriever/kecocokan_makna_verifikasi.promptfooconfig.yaml"; fi
            if [ "$RKF" = "true" ]; then CONFIGS="$CONFIGS prompt_reliability/retriever/kecukupan_struktural_fallback.promptfooconfig.yaml"; fi
            if [ "$QEP" = "true" ]; then CONFIGS="$CONFIGS prompt_reliability/query_engine/penyusunan_request.promptfooconfig.yaml"; fi
            if [ "$QEV" = "true" ]; then CONFIGS="$CONFIGS prompt_reliability/query_engine/verifikasi_bentuk_request.promptfooconfig.yaml"; fi
            if [ "$IN" = "true" ]; then CONFIGS="$CONFIGS prompt_reliability/interpretation/narasi.promptfooconfig.yaml"; fi
            if [ "$IVK" = "true" ]; then CONFIGS="$CONFIGS prompt_reliability/interpretation/verifikasi_kesetiaan.promptfooconfig.yaml"; fi
          fi
          echo "configs=$CONFIGS" >> "$GITHUB_OUTPUT"
      - name: Jalankan config yang relevan (satu-per-satu, akumulasi kegagalan)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROMPTFOO_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          FAILED=0
          for config in ${{ steps.targets.outputs.configs }}; do
            echo "::group::$config"
            uv run python prompt_reliability/run_and_push.py "$config" || FAILED=1
            echo "::endgroup::"
          done
          exit $FAILED

  prompt-eval-gate:
    name: prompt-eval-gate
    needs: prompt-eval
    # if: always() WAJIB - job ini genuinely skip kalau union 17 filter
    # kosong (PR paling umum tidak sentuh prompt), tanpa always() job ini
    # otomatis ikut skip dan required status check bisa macet (gotcha
    # sama seperti test-gate, Keputusan 8 M8.2 - lihat Milestone 8.4
    # Keputusan 5, decisions.md, kenapa aggregator ini TERPISAH dari
    # test-gate meski mekanismenya identik).
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Periksa hasil job prompt-eval
        run: |
          echo "prompt-eval: ${{ needs.prompt-eval.result }}"
          if [ "${{ needs.prompt-eval.result }}" != "success" ] && [ "${{ needs.prompt-eval.result }}" != "skipped" ]; then
            echo "::error::prompt-eval tidak lolos (${{ needs.prompt-eval.result }})"
            exit 1
          fi
          echo "prompt-eval lolos atau skip bersih (union 17 filter kosong, sah)."

  go-test:
    name: go-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom-exporter/supabaseexporter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: custom-exporter/supabaseexporter/go.mod
          cache-dependency-path: custom-exporter/supabaseexporter/go.sum
      - run: go test ./...

  test-gate:
    name: test-gate
    needs: [test-python-fast, go-test, test-python-llm]
    # if: always() WAJIB - tanpa ini, job ini otomatis ikut di-skip kalau
    # salah satu needs (test-python-llm) skip, padahal skip test-python-llm
    # itu SAH (union grup kosong) dan tidak boleh menggagalkan gate
    # (Keputusan 8, decisions.md - atasi gotcha skip-vs-required-check
    # GitHub Actions).
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Periksa hasil seluruh job test
        run: |
          echo "test-python-fast: ${{ needs.test-python-fast.result }}"
          echo "go-test: ${{ needs.go-test.result }}"
          echo "test-python-llm: ${{ needs.test-python-llm.result }}"
          if [ "${{ needs.test-python-fast.result }}" != "success" ]; then
            echo "::error::test-python-fast tidak lolos (${{ needs.test-python-fast.result }})"
            exit 1
          fi
          if [ "${{ needs.go-test.result }}" != "success" ]; then
            echo "::error::go-test tidak lolos (${{ needs.go-test.result }})"
            exit 1
          fi
          if [ "${{ needs.test-python-llm.result }}" != "success" ] && [ "${{ needs.test-python-llm.result }}" != "skipped" ]; then
            echo "::error::test-python-llm tidak lolos (${{ needs.test-python-llm.result }})"
            exit 1
          fi
          echo "Semua job test lolos (test-python-llm skip bersih diterima kalau union grup kosong)."

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: dependency-scan (pip-audit + govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: pip-audit (uv.lock)
        run: uv run --with pip-audit pip-audit
      - uses: actions/setup-go@v5
        with:
          go-version-file: custom-exporter/supabaseexporter/go.mod
          cache-dependency-path: custom-exporter/supabaseexporter/go.sum
      - name: govulncheck (go.sum)
        working-directory: custom-exporter/supabaseexporter
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  build-and-push-backend:
    name: build-and-push-backend
    runs-on: ubuntu-24.04-arm
    # Native ARM64 runner (bukan emulasi QEMU) - Milestone 8.7, target VPS
    # Oracle Ampere A1. Job jalan di push MAUPUN pull_request (ketiganya
    # branch main/develop/staging) supaya bisa jadi required status check
    # PR (Checkpoint 14) tanpa terjebak gotcha "job tidak pernah jalan ->
    # PR macet selamanya" (pola sama test-gate M8.2/prompt-eval-gate M8.4) -
    # bedanya: PR hanya BUILD (validasi Dockerfile+ARM64 compile), TIDAK
    # push ke registry; push ke ghcr.io HANYA terjadi di event push
    # (setelah merge/direct-push).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Tentukan tag image
        id: tags
        run: |
          SHA=$(git rev-parse --short HEAD)
          BRANCH="${GITHUB_REF_NAME}"
          IMAGE="ghcr.io/ardiyanto24/nirwana-chatbot-backend"
          TAGS="$IMAGE:${BRANCH}-${SHA}"
          if [ "$BRANCH" = "main" ]; then
            TAGS="$TAGS,$IMAGE:latest"
          elif [ "$BRANCH" = "develop" ]; then
            TAGS="$TAGS,$IMAGE:staging"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "primary=$IMAGE:${BRANCH}-${SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
          # provenance/sbom false - hindari artifact manifest kosong
          # "unknown/unknown" di ghcr.io (temuan riset M8.7).
      - name: Trivy scan (non-blocking, catat baseline)
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.tags.outputs.primary }}
          format: table
          exit-code: "0"
        # Non-blocking (decisions.md Keputusan 9) - hasil dicatat sebagai
        # baseline di logs.md, kebijakan blocking diputuskan setelah lihat
        # data nyata (mirror proses M8.1 Keputusan 2).

  build-and-push-exporter:
    name: build-and-push-exporter
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Tentukan tag image
        id: tags
        run: |
          SHA=$(git rev-parse --short HEAD)
          BRANCH="${GITHUB_REF_NAME}"
          IMAGE="ghcr.io/ardiyanto24/nirwana-otelcol"
          TAGS="$IMAGE:${BRANCH}-${SHA}"
          if [ "$BRANCH" = "main" ]; then
            TAGS="$TAGS,$IMAGE:latest"
          elif [ "$BRANCH" = "develop" ]; then
            TAGS="$TAGS,$IMAGE:staging"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "primary=$IMAGE:${BRANCH}-${SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./custom-exporter
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
      - name: Trivy scan (non-blocking, catat baseline)
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.tags.outputs.primary }}
          format: table
          exit-code: "0"
