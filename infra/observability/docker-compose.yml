services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: nirwana-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC - titik penerima tunggal untuk seluruh 9 layer
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus scrape endpoint (debugging manual)
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: nirwana-jaeger
    ports:
      - "16686:16686" # Jaeger UI

  prometheus:
    image: prom/prometheus:latest
    container_name: nirwana-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090" # Prometheus UI
    depends_on:
      - otel-collector
