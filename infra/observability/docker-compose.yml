services:
  otel-collector:
    # Image resmi otel/opentelemetry-collector-contrib DIGANTI build custom
    # (Milestone 6.1, PIC 6) - ocb menghasilkan SATU distribusi Collector
    # utuh yang MENGGANTIKAN image resmi, bukan komponen tempel (decisions.md
    # Keputusan Jenis B "builder-config.yaml wajib mendaftarkan seluruh
    # komponen existing"). Dockerfile: ../../custom-exporter/Dockerfile.
    build:
      context: ../../custom-exporter
    container_name: nirwana-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    environment:
      - SUPABASE_EXPORTER_DSN=${SUPABASE_EXPORTER_DSN}
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC - titik penerima tunggal untuk seluruh 9 layer
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus scrape endpoint (debugging manual)
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: nirwana-jaeger
    ports:
      - "16686:16686" # Jaeger UI

  prometheus:
    image: prom/prometheus:latest
    container_name: nirwana-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090" # Prometheus UI
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana-oss:latest
    container_name: nirwana-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana # cache sekunder saja - sumber kebenaran config ada di provisioning/ (git)
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000" # Grafana UI (host 3001 - port 3000 dipakai proses lain di mesin developer, lihat logs.md Checkpoint 2)
    depends_on:
      - jaeger
      - prometheus

volumes:
  grafana-data:
