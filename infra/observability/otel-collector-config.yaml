receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    timeout: 5s
  attributes:
    actions:
      - key: deployment.environment
        value: local-dev
        action: upsert

connectors:
  # span_metrics (Milestone 5.1, decisions.md Keputusan 4) - menurunkan metrik
  # agregat (count/duration) DARI span, karena Jaeger datasource Grafana tidak
  # mendukung agregasi time-series/count-by-tag native. Pipeline tambahan murni
  # aditif (lihat pipeline traces/spanmetrics + metrics/spanmetrics di bawah) -
  # pipeline `traces` existing menuju Jaeger TIDAK diubah.
  # Dimension custom: prompt.id (disambiguator span "chat" yang nama-nya
  # reused lintas layer) + error.type (taksonomi status kegagalan) - keduanya
  # sudah terpasang di instrumentasi existing PIC 1-4, zero-touch ke kode layer.
  # riwayat.status (decisions.md Keputusan 5) - atribut span riwayat.simpan
  # (src/orchestration/riwayat_percakapan.py, M7.18), sumber panel "Distribusi
  # Status" karena satu-satunya sinyal status level-turn yang mencakup nilai
  # positif "berhasil" (error.type hanya terpasang di jalur kegagalan).
  span_metrics:
    dimensions:
      - name: prompt.id
      - name: error.type
      - name: riwayat.status
    metrics_flush_interval: 15s

exporters:
  # --- Jalur privat (aktif penuh) ---
  # Trace -> Jaeger (Jaeger all-in-one punya OTLP receiver bawaan di 4317/4318
  # di dalam network docker compose, tidak diekspos ke host - satu-satunya
  # titik penerima OTLP dari luar adalah Collector ini sendiri).
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  # Metrics -> diserap Prometheus lewat scrape endpoint yang dibuka exporter ini.
  prometheus:
    endpoint: 0.0.0.0:8889

  # --- Jalur publik (slot kosong, JANGAN DIHAPUS) ---
  # Diisi Milestone 6.1 (rancangan-custom-exporter-supabase.md, PIC 6) dengan
  # custom exporter Go yang menulis span ke Supabase. Bentuk contoh (belum aktif):
  #
  # otlphttp/supabase_exporter:
  #   endpoint: http://custom-exporter:4319
  #
  # Setelah exporter publik ini diisi, tambahkan namanya ke daftar `exporters`
  # pipeline `traces` di bawah (mis. [otlp_grpc/jaeger, otlphttp/supabase_exporter]).

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes]
      exporters: [otlp_grpc/jaeger]
    # Pipeline BARU aditif (Milestone 5.1) - receiver `otlp` yang sama secara
    # fan-out, TIDAK mengubah pipeline `traces` di atas. Connector `span_metrics`
    # bertindak sebagai exporter di sini, dan sebagai receiver di pipeline
    # metrics/spanmetrics di bawah.
    traces/spanmetrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes]
      exporters: [span_metrics]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes]
      exporters: [prometheus]
    metrics/spanmetrics:
      receivers: [span_metrics]
      processors: [batch]
      exporters: [prometheus]
